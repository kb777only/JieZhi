[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jiezhi"
version = "0.9.0a1"
description = "Borrow your Android phone's local AI compute from a native Linux desktop app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6==6.11.2",
  "requests==2.34.2",
  "pypdf==6.19.0",
  "keyring==25.7.0",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0,<10", "pytest-qt>=4.5,<5"]

[project.scripts]
jiezhi = "main:main"
jiezhi-gateway = "jiezhi.gateway:main"

[tool.setuptools]
package-dir = {"" = "host"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["host"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["host"]
